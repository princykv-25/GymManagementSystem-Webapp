<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Update Trainer Password - Gym Management System</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="page-shell page-center">
  <div class="title-banner">
    <h1>Gym Management System</h1>
    <p>Update an existing trainer password</p>
  </div>

  <section class="glass-panel login-container">
    <h2>Update Trainer Password</h2>
    <form id="resetTrainerPasswordForm" class="stack-form">
      <input type="email" id="resetTrainerEmail" placeholder="Registered Trainer Email" required />
      <input
        type="password"
        id="resetTrainerNewPassword"
        placeholder="New Password (Min 8 chars, 1 uppercase, 1 number)"
        pattern="^(?=.*[A-Z])(?=.*\d).{8,}$"
        title="Password must be at least 8 characters long and include at least 1 uppercase letter and 1 number."
        required
      />
      <button type="submit">Update Password</button>
      <p class="form-note">
        <a href="index.html">Back to Login</a>
      </p>
    </form>
  </section>

  <script src="js/script.js"></script>
</body>
</html>
